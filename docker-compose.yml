services:
  # ─── Infrastructure ───────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg17
    container_name: finsight-postgres
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: finsight_db
    ports:
      - "5433:5432"  # 5433 on host to avoid conflict with local Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - finsight-net

  # ─── Services ─────────────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: finsight-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finsight_db?currentSchema=auth
      SPRING_DATASOURCE_USERNAME: finsight
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finsight-net
    restart: on-failure

  document-service:
    build:
      context: .
      dockerfile: document-service/Dockerfile
    container_name: finsight-document
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finsight_db?currentSchema=documents&options=-c%20search_path%3Ddocuments%2Cpublic
      SPRING_DATASOURCE_USERNAME: finsight
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      JINA_API_KEY: ${JINA_API_KEY}
      FINSIGHT_UPLOAD_DIRECTORY: /app/uploads
    ports:
      - "8082:8082"
    volumes:
      - document_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finsight-net
    restart: on-failure

  conversation-service:
    build:
      context: .
      dockerfile: conversation-service/Dockerfile
    container_name: finsight-conversation
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finsight_db?currentSchema=conversations&options=-c%20search_path%3Dconversations%2Cdocuments%2Cpublic
      SPRING_DATASOURCE_USERNAME: finsight
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      JINA_API_KEY: ${JINA_API_KEY}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - finsight-net
    restart: on-failure

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: finsight-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - document-service
      - conversation-service
    networks:
      - finsight-net
    restart: on-failure

volumes:
  postgres_data:
  document_uploads:

networks:
  finsight-net:
    driver: bridge